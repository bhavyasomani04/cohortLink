spring.application.name=demo

# ============================================================
# Database — values supplied via environment variables
# ============================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cohortLinkdb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# Hibernate / JPA
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
# Force all LocalDateTime values to be read/written as UTC so they are
# comparable with PostgreSQL's NOW() (which also runs in UTC).
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ============================================================
# Spring Security — disable Basic Auth stub
# ============================================================
spring.security.user.name=user
spring.security.user.password=disabled

# ============================================================
# Session — stateless (JWT-based via Firebase)
# ============================================================
spring.session.store-type=none

# ============================================================
# Firebase Admin SDK
# ============================================================
# Path to your service-account JSON file (absolute or classpath-relative).
# Example: /secrets/firebase-service-account.json
firebase.service-account-path=${FIREBASE_SERVICE_ACCOUNT_PATH:}

# ============================================================
# AWS S3 — presigned URL upload
# ============================================================
aws.region=${AWS_REGION:ap-south-1}
aws.s3.bucket-name=${AWS_S3_BUCKET_NAME}
aws.access-key=${AWS_ACCESS_KEY_ID:}
aws.secret-key=${AWS_SECRET_ACCESS_KEY:}
aws.s3.presign-duration-minutes=${AWS_S3_PRESIGN_DURATION_MINUTES:15}

# ============================================================
# CORS — comma-separated list of allowed origins
# ============================================================
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# ============================================================
# Redis — Caching layer
# ============================================================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.cache.type=redis
# Default TTL fallback (milliseconds) — overridden per cache in CacheConfig.java
spring.cache.redis.time-to-live=120000
# Use JSON serialization for human-readable keys in Redis CLI
spring.cache.redis.use-key-prefix=true
spring.cache.redis.key-prefix=cohortlink::

# ============================================================
# Mail — JavaMailSender (SMTP)
# ============================================================
# Default: Gmail SMTP. For production use AWS SES or SendGrid SMTP relay.
# AWS SES:     host=email-smtp.ap-south-1.amazonaws.com  port=587
# SendGrid:    host=smtp.sendgrid.net                    port=587  username=apikey
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
# Sender display name and address shown in the From: header
mail.from.address=${MAIL_FROM_ADDRESS:noreply@cohortlink.app}
mail.from.name=${MAIL_FROM_NAME:CohortLink}
# Do NOT fail on startup if SMTP creds are missing (local dev)
spring.mail.test-connection=false