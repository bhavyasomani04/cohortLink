version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: cohortLink_redis
    ports:
      - "6379:6379"
    restart: always

  backend:
    image: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/cohortlink-backend:latest
    container_name: cohortLink_backend
    ports:
      - "8080:8080"
    depends_on:
      - redis
    environment:
      - DB_URL=jdbc:postgresql://${RDS_ENDPOINT}:5432/cohortLinkdb
      - DB_USERNAME=postgres
      - DB_PASSWORD=${RDS_PASSWORD}
      - FIREBASE_SERVICE_ACCOUNT_PATH=/app/firebase-adminsdk.json
      - AWS_REGION=${AWS_REGION}
      - AWS_S3_BUCKET_NAME=${AWS_S3_BUCKET_NAME}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_S3_PRESIGN_DURATION_MINUTES=15
      - CORS_ALLOWED_ORIGINS=http://${EC2_HOST_IP}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MAIL_HOST=smtp.gmail.com
      - MAIL_PORT=587
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - MAIL_FROM_ADDRESS=${MAIL_USERNAME}
      - MAIL_FROM_NAME=CohortLink
    volumes:
      - ./firebase-adminsdk.json:/app/firebase-adminsdk.json:ro
    restart: always

  frontend:
    image: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/cohortlink-frontend:latest
    container_name: cohortLink_frontend
    ports:
      - "80:80" 
    depends_on:
      - backend
    restart: always
