name: Deploy to AWS ECR and EC2

on:
  push:
    branches:
      - main # This pipeline triggers every time you push to the 'main' branch

env:
  AWS_REGION: ap-south-1 # Change this if your AWS region is different
  ECR_REPOSITORY_FRONTEND: cohortlink-frontend
  ECR_REPOSITORY_BACKEND: cohortlink-backend

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build, tag, and push Backend Image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: latest
      run: |
        cd cohortLink_backend/demo
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY_BACKEND:$IMAGE_TAG .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY_BACKEND:$IMAGE_TAG

    - name: Build, tag, and push Frontend Image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: latest
        EC2_HOST_IP: ${{ secrets.EC2_HOST_IP }}
      run: |
        cd cohortLink-frontend1
        echo "VITE_FIREBASE_API_KEY=AIzaSyDobTgk1x3SUb5d9EFdlSQ49bU16VkPxhA" > .env.production
        echo "VITE_FIREBASE_AUTH_DOMAIN=cohortlink.firebaseapp.com" >> .env.production
        echo "VITE_FIREBASE_PROJECT_ID=cohortlink" >> .env.production
        echo "VITE_FIREBASE_STORAGE_BUCKET=cohortlink.firebasestorage.app" >> .env.production
        echo "VITE_FIREBASE_MESSAGING_SENDER_ID=139907391261" >> .env.production
        echo "VITE_FIREBASE_APP_ID=1:139907391261:web:b1524e8bcd4952fda04bf4" >> .env.production
        echo "VITE_MAPBOX_TOKEN=${{ secrets.VITE_MAPBOX_TOKEN }}" >> .env.production
        echo "VITE_API_BASE_URL=http://${EC2_HOST_IP}:8080" >> .env.production
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY_FRONTEND:$IMAGE_TAG .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY_FRONTEND:$IMAGE_TAG

    - name: Copy docker-compose to EC2
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.EC2_HOST_IP }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        source: "docker-compose.prod.yml"
        target: "/home/ubuntu/cohortLink"

    - name: Deploy to EC2
      uses: appleboy/ssh-action@v1.0.3
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        RDS_ENDPOINT: ${{ secrets.RDS_ENDPOINT }}
        RDS_PASSWORD: ${{ secrets.RDS_PASSWORD }}
      with:
        host: ${{ secrets.EC2_HOST_IP }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        envs: ECR_REGISTRY, AWS_REGION, AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_ACCOUNT_ID, RDS_ENDPOINT, RDS_PASSWORD
        script: |
          # 1. Log the EC2 server into ECR
          aws ecr get-login-password --region $AWS_REGION | sudo docker login --username AWS --password-stdin $ECR_REGISTRY
          
          # 2. Navigate to your app directory
          cd ~/cohortLink
          
          # 3. Securely create the .env file for docker-compose
          echo "AWS_ACCOUNT_ID=$AWS_ACCOUNT_ID" > .env
          echo "AWS_REGION=$AWS_REGION" >> .env
          echo "RDS_ENDPOINT=$RDS_ENDPOINT" >> .env
          echo "RDS_PASSWORD=$RDS_PASSWORD" >> .env
          
          # 4. Pull the fresh images
          sudo docker compose -f docker-compose.prod.yml pull || sudo docker-compose -f docker-compose.prod.yml pull
          
          # 5. Restart the containers with the new code
          sudo docker compose -f docker-compose.prod.yml up -d || sudo docker-compose -f docker-compose.prod.yml up -d
